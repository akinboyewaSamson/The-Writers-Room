server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Database (no defaults on purpose: the app refuses to start if these are missing)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Seeded editor account (only created the first time the app starts on an empty database)
blog.default-editor.name=${EDITOR_NAME:Chief Editor}
blog.default-editor.email=${EDITOR_EMAIL}
blog.default-editor.password=${EDITOR_PASSWORD}

# Frontend origin(s) allowed to call the API, comma-separated, no trailing slash
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Hide Swagger in production
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false
